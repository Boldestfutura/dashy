# Builds the container image on every push that touches the app, and publishes
# it to ghcr.io. TrueNAS polls the registry for custom apps, so a successful
# run here is what makes the Apps page offer an update.
name: image

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.github/workflows/image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ghcr.io rejects an uppercase path, and the owner here has one
      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # the version the image gets tagged with is the one the app reports,
      # so there is no second place to remember to bump
      - id: ver
        run: |
          V=$(grep -m1 '^APP_VERSION' app/server.py | sed 's/.*"\(.*\)".*/\1/')
          [ -n "$V" ] || { echo "no APP_VERSION in app/server.py"; exit 1; }
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "building $V"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.ver.outputs.v }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.v }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
